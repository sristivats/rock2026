<!doctype html>
<html lang="en">

<head>
  {% load static %}
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vinyl Player — GSAP + Audio</title>

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      margin: 0;
      padding: 1rem;
      background: #0f1113;
      color: #fff;
    }

    .vinyl {
      width: 100%;
      aspect-ratio: 16/6.5;
      position: relative;
      overflow: hidden;
      margin-top: 1rem;
      user-select: none;
    }

    .vinyl-board {
      width: 100%;
      position: absolute;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    .vinyl-player {
      position: absolute;
      z-index: 2;
      width: 69%;
      top: -4%;
      left: 19%;
      pointer-events: none;
      transform-origin: 50% 50%;
    }

    .vinyl-disk {
      position: absolute;
      z-index: 3;
      width: 12%;
      max-width: 180px;
      top: 66%;
      left: 48%;
      pointer-events: none;
    }

    .vinyl-tonearm {
      position: absolute;
      z-index: 4;
      width: 42%;
      top: 20%;
      left: 9.5%;
      transform: rotate(-5deg);
      transform-origin: 13.2% 82%;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }

    .vinyl-tonearm:active {
      cursor: grabbing;
    }

    .vinyl-tonearm img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    .tonearm-tip {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      left: 80%;
      top: 0%;
      transform: translate(50%, 50%);
      pointer-events: none;
      background: transparent;
    }

    .audio-unlock {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      display: none;
      z-index: 9999;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    @media (max-width: 1025px) {
      .vinyl {
        aspect-ratio: 16/9;
      }

      .vinyl-board {
        width: 80%;
        top: 52%;
      }

      .vinyl-player {
        width: 55%;
        top: 4%;
        left: 25%;
      }

      .vinyl-disk {
        width: 14%;
        top: 41.5%;
        left: 46%;
      }

      .vinyl-tonearm {
        width: 34%;
        top: 17.5%;
        left: 18%;
        transform: rotate(-10deg);
      }
    }

    @media (max-width: 431px) {
      .vinyl {
        aspect-ratio: 16/12;
      }

      .vinyl-board {
        width: 100%;
      }

      .vinyl-player {
        width: 68.5%;
        top: 7%;
        left: 19%;
      }

      .vinyl-disk {
        width: 21%;
        top: 38%;
        left: 43%;
      }

      .vinyl-tonearm {
        width: 43%;
        top: 20%;
        left: 10%;
        transform: rotate(-5deg);
      }

      .tonearm-tip {
        width: 10px;
        height: 10px;
      }
    }
  </style>
</head>

<body>
  <audio id="vinylAudio" preload="auto" loop>
    <source src="{% static 'bands/music/track.mp3' %}" type="audio/mpeg">
  </audio>

  <div class="vinyl">
    <img src="{% static 'bands/images/vinylBoard.png' %}" class="vinyl-board">
    <img src="{% static 'bands/images/vinyl.png' %}" class="vinyl-player" id="playerImg">
    <img src="{% static 'bands/images/vinylDisk.png' %}" class="vinyl-disk" id="vinylDisk">
    <div class="vinyl-tonearm" id="tonearm">
      <img src="{% static 'bands/images/vinylTonearm.png' %}" alt="tonearm">
      <div class="tonearm-tip" id="tip"></div>
    </div>
  </div>

  <button id="unlockBtn" class="audio-unlock">Enable sound</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      gsap.registerPlugin(Draggable);
      const mm = gsap.matchMedia();
      mm.add("(min-width:1025px)", () => setup({ MIN_ANGLE: -20, MAX_ANGLE: -5 }));
      mm.add("(max-width:1024px)", () => setup({ MIN_ANGLE: -25, MAX_ANGLE: -10 }));
      mm.add("(max-width:430px)", () => setup({ MIN_ANGLE: -25, MAX_ANGLE: -5 }));

      function setup({ MIN_ANGLE, MAX_ANGLE }) {
        const tonearm = document.getElementById("tonearm");
        const tip = document.getElementById("tip");
        const player = document.getElementById("playerImg");
        const disk = document.getElementById("vinylDisk");
        const audio = document.getElementById("vinylAudio");
        const unlockBtn = document.getElementById("unlockBtn");

        gsap.set(tonearm, { transformOrigin: "13.2% 82%", rotation: MAX_ANGLE });
        gsap.set(player, { transformOrigin: "50% 50%" });

        const spin = gsap.to(player, {
          rotation: "+=360", duration: 4, ease: "none", repeat: -1, paused: true
        });
        spin.timeScale(0);

        function getCenter(el) {
          const rect = el.getBoundingClientRect();
          return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, r: rect.width / 2 };
        }

        function isTipOnDisk() {
          const tipRect = tip.getBoundingClientRect();
          const tipCenter = { x: tipRect.left + tipRect.width / 2, y: tipRect.top + tipRect.height / 2 };
          const diskCenter = getCenter(disk);
          const dx = tipCenter.x - diskCenter.x;
          const dy = tipCenter.y - diskCenter.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          return distance <= diskCenter.r * 0.9; // 0.9 for tighter tolerance
        }

        async function tryPlayAudio() {
          try { await audio.play(); unlockBtn.style.display = "none"; }
          catch { unlockBtn.style.display = "block"; }
        }
        function pauseAudio() { try { audio.pause(); } catch { } }

        let rampIn, rampOut;
        function startSpin() {
          if (spin.paused()) spin.play();
          if (rampIn) rampIn.kill(); if (rampOut) rampOut.kill();
          rampIn = gsap.to(spin, { timeScale: 1, duration: 0.35, ease: "power1.out", onStart: tryPlayAudio });
        }
        function stopSpin() {
          if (rampIn) rampIn.kill(); if (rampOut) rampOut.kill();
          rampOut = gsap.to(spin, { timeScale: 0, duration: 0.25, ease: "power1.out", onComplete: () => { spin.pause(); pauseAudio(); } });
        }

        const drag = Draggable.create(tonearm, {
          type: "rotation", inertia: false,
          onPress() { stopSpin(); gsap.to(this.target, { scale: 1.02, duration: 0.12 }); },
          onDrag() {
            const clamped = gsap.utils.clamp(MIN_ANGLE, MAX_ANGLE, this.rotation);
            gsap.set(this.target, { rotation: clamped });
          },
          onRelease() {
            gsap.to(this.target, { scale: 1, duration: 0.12 });
            const final = gsap.utils.clamp(MIN_ANGLE, MAX_ANGLE, this.rotation);
            gsap.set(this.target, { rotation: final });
            if (isTipOnDisk()) startSpin(); else stopSpin();
          }
        })[0];

        unlockBtn.onclick = () => { tryPlayAudio().then(() => { if (isTipOnDisk()) startSpin(); }); };

        // auto start if already on disk
        if (isTipOnDisk()) startSpin();

        const onResize = () => { if (isTipOnDisk()) startSpin(); else stopSpin(); };
        window.addEventListener("resize", onResize);

        return () => { window.removeEventListener("resize", onResize); drag.kill(); spin.kill(); };
      }
    });
  </script>
</body>

</html>
