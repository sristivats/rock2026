<!DOCTYPE html>
<html lang="en">

<head>
  {% load static %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="{% static 'bands/css/trialStyles.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
  <script src="{% static 'bands/js/trialAnimate.js' %}" defer></script>
</head>

<body>
  <audio id="vinylAudio" preload="auto" loop>
    <source src="{% static 'bands/music/track.mp3' %}" type="audio/mpeg">
    <!-- provide fallback types as needed -->
    Your browser does not support the audio element.
  </audio>

  <div class="heading">
    <div class="wrapper">
      <div class="main1">
        <h1>ROCK O PHONIX</h1>

        <div class="vinyl">
          <img src="{% static 'bands/images/vinylBoard.png' %}" alt="" class="vinyl-board">
          <img src="{% static 'bands/images/vinyl.png' %}" alt="" class="vinyl-player">
          <img src="{% static 'bands/images/vinylDisk.png' %}" alt="" class="vinyl-disk">
          <div class="vinyl-tonearm" id="tonearm">
            <img src="{% static 'bands/images/vinylTonearm.png' %}" alt="tonearm" draggable="false">
            <div class="tonearm-tip" id="tip" aria-hidden="true"></div>
          </div>
          <div class="play-area"></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
